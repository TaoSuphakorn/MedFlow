# Optional isolated first-run verification using existing built images.
# docker compose -p medflow-first-run -f docker-compose.yml -f docker/acceptance.override.yml up -d --no-build
# Requires Docker Compose >= 2.24.4 for !override.
services:
  backend:
    image: medflow-ai-backend:latest
    ports: !override ["127.0.0.1:8081:8080"]
    environment:
      OPENAI_API_KEY: ""
  frontend:
    image: medflow-ai-frontend:latest
    ports: !override ["127.0.0.1:3001:80"]
