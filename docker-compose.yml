name: medflow-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__Database: Host=postgres;Database=medflow;Username=medflow;Password=${POSTGRES_PASSWORD:-local-demo-db-only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      Demo__Password: ${DEMO_PASSWORD:-Demo!2026}
    volumes:
      - data-protection:/keys
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://backend:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://frontend/frontend-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  test-postgres:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: medflow_test
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__Database: Host=test-postgres;Database=medflow_test;Username=medflow;Password=test-only-password
      Demo__Password: Demo!2026
    depends_on:
      test-postgres:
        condition: service_healthy
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.test
    environment:
      BASE_URL: http://frontend
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
      - ./docs/screenshots:/app/screenshots
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  postgres-data:
  data-protection:
